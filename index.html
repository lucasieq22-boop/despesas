<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lançar Despesa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="icon" type="image/png" href="https://base.infinityfreeapp.com/Imagens/lancar.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://base.infinityfreeapp.com/Imagens/lancar.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Despesas">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 6px 10px;
      background: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      -webkit-text-size-adjust: 100%;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 14px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 10px;
      text-align: center;
      color: #111;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    label {
      font-size: 15px;
      color: #333;
      font-weight: 600;
      margin: 0;
    }

    #btn-teclado {
      background: #f0f2f5;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
      -webkit-user-select: none;
    }

    #btn-teclado:active {
      background: #e2e6ec;
      transform: scale(0.96);
    }

    textarea {
      width: 100%;
      font-size: 18px !important;
      font-family: inherit;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid #c7c7c7;
      outline: none;
      resize: none;
      min-height: 65px;
      height: 65px;
      line-height: 1.35;
      display: block;
      -webkit-appearance: none;
    }

    textarea::placeholder {
      color: #aaa;
    }

    textarea:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 2px rgba(66,133,244,0.2);
    }

    .field {
      margin-bottom: 8px;
    }

    .tabela-atalhos {
      width: 100%;
      border-collapse: separate;
      border-spacing: 5px;
      margin-top: 6px;
      table-layout: fixed;
    }

    .tabela-atalhos td {
      width: 33.333% !important;
      padding: 0;
    }

    .atalho-btn {
      width: 100% !important;
      height: 34px;
      padding: 0 2px;
      border-radius: 8px;
      background: #eef3ff;
      color: #222;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid #d5e2ff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
      -webkit-user-select: none;
    }

    .atalho-btn:active {
      background: #cddcff;
      transform: scale(0.96);
    }

    #btn-salvar {
      width: 100%;
      font-size: 17px;
      font-family: inherit;
      margin-top: 10px;
      padding: 12px;
      border-radius: 999px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      background: #4285f4;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.02em;
      box-shadow: 0 3px 10px rgba(66,133,244,0.3);
      -webkit-appearance: none;
    }

    #btn-salvar:active {
      transform: scale(0.98);
    }

    #btn-salvar:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .msg {
      margin-top: 10px;
      font-size: 15px;
      text-align: center;
      font-weight: 500;
    }

    .msg.ok {
      color: #0c7c3c;
    }

    .msg.erro {
      color: #d93025;
    }

    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 6px;
      line-height: 1.3;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Registrar Despesa</h1>

      <form id="form-despesa" onsubmit="handleSubmit(event)">
        <div class="field">
          <div class="label-row">
            <label for="linha">Despesa (valor + descrição)</label>
            <div role="button" tabindex="-1" id="btn-teclado"
              ontouchstart="event.preventDefault()"
              ontouchend="alternarTeclado()"
              onclick="alternarTeclado()">🔢 Números</div>
          </div>

          <textarea id="linha" name="linha" inputmode="decimal"
            placeholder="Ex: 35,90 almoço shopping&#10;Ex: 120 gasolina"
            required></textarea>

          <table class="tabela-atalhos">
            <tr>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('café')" onclick="inserirDescricao('café')">☕ Café</div></td>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('almoço')" onclick="inserirDescricao('almoço')">🍽️ Almoço</div></td>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('janta')" onclick="inserirDescricao('janta')">🌙 Janta</div></td>
            </tr>
            <tr>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('gasolina')" onclick="inserirDescricao('gasolina')">⛽ Posto</div></td>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('lanche')" onclick="inserirDescricao('lanche')">😋 Lanche</div></td>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('mercado')" onclick="inserirDescricao('mercado')">🛒 Mercado</div></td>
            </tr>
            <tr>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('receita')" onclick="inserirDescricao('receita')">💵 Receita</div></td>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('revenda')" onclick="inserirDescricao('revenda')">🛍️ Revenda</div></td>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('lazer')" onclick="inserirDescricao('lazer')">🚴 Lazer</div></td>
            </tr>
            <tr>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('investimento')" onclick="inserirDescricao('investimento')">👜 Invest.</div></td>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('moradia')" onclick="inserirDescricao('moradia')">🏠 Moradia</div></td>
              <td><div role="button" class="atalho-btn" ontouchstart="event.preventDefault()" ontouchend="inserirDescricao('doação')" onclick="inserirDescricao('doação')">🩸 Doação</div></td>
            </tr>
          </table>

          <div class="hint">
            Digite o valor primeiro e depois a descrição, na mesma linha.
          </div>
        </div>

        <button type="submit" id="btn-salvar">Salvar despesa</button>
      </form>

      <div id="mensagem" class="msg"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzDjqifo8xTwA9hsyN2JJ7Vfj661kIFjnYmHPPo-fFOO52J8I69soLye_49X7Dq73O3/exec";
    let ultimoToque = 0;

    function definirModoTeclado(modo) {
      const campo = document.getElementById('linha');
      const btn = document.getElementById('btn-teclado');

      campo.inputMode = modo;
      campo.setAttribute('inputmode', modo);
      btn.textContent = modo === 'decimal' ? '🔢 Números' : '🔤 Letras';
    }

    function focarNoFinal() {
      const campo = document.getElementById('linha');
      campo.focus({ preventScroll: true });
      const len = campo.value.length;
      campo.setSelectionRange(len, len);
    }

    function alternarTeclado() {
      const agora = Date.now();
      if (agora - ultimoToque < 250) return; // evita disparo duplo entre touchend e click
      ultimoToque = agora;

      const campo = document.getElementById('linha');
      const modoAtual = campo.getAttribute('inputmode');
      const novoModo = modoAtual === 'decimal' ? 'text' : 'decimal';

      definirModoTeclado(novoModo);
      focarNoFinal();
    }

    window.addEventListener('DOMContentLoaded', () => definirModoTeclado('decimal'));
    window.addEventListener('pageshow', () => definirModoTeclado('decimal'));

    function inserirDescricao(descricao) {
      const agora = Date.now();
      if (agora - ultimoToque < 250) return; // evita disparo duplo entre touchend e click
      ultimoToque = agora;

      const campo = document.getElementById('linha');
      let texto = campo.value.trim();

      if (!texto) {
        campo.value = descricao;
      } else {
        const partes = texto.split(/\s+/);
        if (partes.length === 1) {
          campo.value = texto + ' ' + descricao;
        } else {
          campo.value = partes[0] + ' ' + descricao;
        }
      }

      if (campo.getAttribute('inputmode') === 'decimal') {
        definirModoTeclado('text');
      }
      focarNoFinal();
    }

    async function handleSubmit(event) {
      event.preventDefault();

      const linhaInput = document.getElementById('linha');
      const btn = document.getElementById('btn-salvar');
      const msg = document.getElementById('mensagem');
      const texto = linhaInput.value.trim();

      if (!texto) {
        msg.textContent = 'Informe valor e descrição na mesma linha.';
        msg.className = 'msg erro';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';
      msg.textContent = '';
      msg.className = 'msg';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ texto: texto }),
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          }
        });

        const retorno = await response.json();

        if (retorno.ok) {
          const valorFormatado = Number(retorno.valor).toFixed(2).replace('.', ',');
          msg.textContent = `Despesa salva! Valor: R$ ${valorFormatado} | Categoria: ${retorno.categoria}`;
          msg.className = 'msg ok';
          linhaInput.value = '';
          definirModoTeclado('decimal');
          focarNoFinal();
        } else {
          throw new Error(retorno.message || 'Erro ao salvar despesa.');
        }

      } catch (erro) {
        msg.textContent = erro.message || 'Erro de conexão ao salvar despesa.';
        msg.className = 'msg erro';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salvar despesa';
      }
    }
  </script>
</body>
</html>
